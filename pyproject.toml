[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-memory-kit"
version = "0.1.0"
description = "Evidence-linked session handoff store, read-only AST codebase onboarding scanner, and verification workflow harness for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Tu Nguyen", email = "120351589+tunguyenNode@users.noreply.github.com" }
]
keywords = [
  "ai-agents",
  "codex",
  "agent-memory",
  "codebase-onboarding",
  "sqlite",
  "ast-scanner",
  "handoff",
  "developer-tools"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tunguyenNode/project-memory-kit"
Repository = "https://github.com/tunguyenNode/project-memory-kit"
Issues = "https://github.com/tunguyenNode/project-memory-kit/issues"

[project.scripts]
project-memory = "project_memory.__main__:main"
project-memory-codebase = "project_memory.codebase:main"
project-memory-workflow = "project_memory.workflow:main"

[tool.setuptools.packages.find]
include = ["project_memory*"]
